version: 2

models:
  - name: mart_top_products
    description: "Aggregated sales by product and month"

    columns:
      - name: product_id
        tests:
          - not_null

      - name: year
        tests:
          - not_null

      - name: month
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - product_id
            - year
            - month

  # MART_SALES_BY_STATE
  - name: mart_sales_by_state
    description: "Monthly aggregated sales metrics by customer state"

    columns:

      # DIMENSIONS
      - name: customer_state
        description: "State of the customer where the order was delivered"
        tests:
          - not_null

      - name: year
        description: "Year of the order"
        tests:
          - not_null

      - name: month
        description: "Month number of the order (1-12)"
        tests:
          - not_null

      - name: month_name
        description: "Name of the month"

      # METRICS
      - name: total_revenue
        description: "Total revenue generated from sales"
        tests:
          - not_null

      - name: avg_order_value
        description: "Average revenue per order (AOV)"

      - name: total_orders
        description: "Number of distinct orders"
        tests:
          - not_null

      - name: total_items_sold
        description: "Total number of items sold"
        tests:
          - not_null


  # MART_CUSTOMER_ANALYSIS
  - name: mart_customer_analysis
    description: "Customer behavior mart with monthly aggregation, revenue, orders and customer type classification."

    columns:

      - name: customer_unique_id
        description: "Unique identifier of the customer"
        tests:
          - not_null

      - name: year
        description: "Year of the transaction"
        tests:
          - not_null

      - name: month
        description: "Month of the transaction"
        tests:
          - not_null

      - name: total_orders
        description: "Total number of orders per customer and month"
        tests:
          - not_null

      - name: total_revenue
        description: "Total revenue per customer and month"
        tests:
          - not_null

      - name: customer_type
        description: "Classification of customer as new or repeat"
        tests:
          - not_null
          - accepted_values:
              values: ['new', 'repeat']

      - name: gender
        description: "Customer gender"

      - name: loyalty_tier
        description: "Latest loyalty tier of the customer"
