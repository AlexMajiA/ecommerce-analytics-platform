version: 2

models:
  - name: mart_top_products
    description: "Aggregated sales by product and month"

    columns:
      - name: product_id
        tests:
          - not_null

      - name: year
        tests:
          - not_null

      - name: month
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - product_id
            - year
            - month

  # MART_SALES_BY_STATE
  - name: mart_sales_by_state
    description: "Monthly aggregated sales metrics by customer state"

    columns:

      # DIMENSIONS
      - name: customer_state
        description: "State of the customer where the order was delivered"
        tests:
          - not_null

      - name: year
        description: "Year of the order"
        tests:
          - not_null

      - name: month
        description: "Month number of the order (1-12)"
        tests:
          - not_null

      - name: month_name
        description: "Name of the month"

      # METRICS
      - name: total_revenue
        description: "Total revenue generated from sales"
        tests:
          - not_null

      - name: avg_order_value
        description: "Average revenue per order (AOV)"

      - name: total_orders
        description: "Number of distinct orders"
        tests:
          - not_null

      - name: total_items_sold
        description: "Total number of items sold"
        tests:
          - not_null


  # MART_CUSTOMER_BASE
  - name: mart_customer_base
    description: "Base customer mart with monthly metrics, recency and attributes. Source for RFM analysis."

    columns:

      - name: customer_unique_id
        tests:
          - not_null

      - name: year
        tests:
          - not_null

      - name: month
        tests:
          - not_null

      - name: total_orders
        tests:
          - not_null

      - name: total_revenue
        tests:
          - not_null

      - name: avg_order_value

      - name: recency_days

      - name: customer_type
        tests:
          - not_null
          - accepted_values:
              values: ['new', 'repeat']

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - customer_unique_id
            - year
            - month


  # MART_CUSTOMER_RFM
  - name: mart_customer_rfm
    description: "Customer segmentation using RFM (Recency, Frequency, Monetary) scores."

    columns:

      - name: customer_unique_id
        tests:
          - not_null

      - name: year
        tests:
          - not_null

      - name: month
        tests:
          - not_null

      - name: recency_score
        tests:
          - not_null

      - name: frequency_score
        tests:
          - not_null

      - name: monetary_score
        tests:
          - not_null

      - name: rfm_segment
        description: "Concatenation of RFM scores"

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - customer_unique_id
            - year
            - month