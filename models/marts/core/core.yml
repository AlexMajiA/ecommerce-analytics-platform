version: 2

models:

  - name: dim_date
    description: "Calendar dimension used for time-based analysis."

    columns:

      - name: date_key
        description: "Primary key for the date dimension (YYYYMMDD)."
        tests:
          - unique
          - not_null

      - name: date_day
        description: "Actual calendar date."
        tests:
          - not_null

      - name: year
        description: "Year component of the date."

      - name: month
        description: "Month number (1-12)."

      - name: month_name
        description: "Month name."

      - name: day_of_week
        description: "Day of the week."

  - name: dim_customers
    description: "Customer dimension enriched with demographic and marketing attributes."

    columns:

      - name: customer_id
        description: "Primary key of the customer."
        tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: "Business identifier of the customer."