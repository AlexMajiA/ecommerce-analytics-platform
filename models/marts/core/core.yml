version: 2

models:

  # DIM_DATE
  - name: dim_date
    description: "Calendar dimension used for time-based analysis."

    columns:

      - name: date_key
        description: "Primary key for the date dimension (YYYYMMDD)."
        tests:
          - unique
          - not_null

      - name: date_day
        description: "Actual calendar date."
        tests:
          - not_null

      - name: year
      - name: month
      - name: month_name
      - name: day_of_week

  # DIM_CUSTOMERS
  - name: dim_customers
    description: "Customer dimension enriched with demographic and marketing attributes."

    columns:

      - name: customer_id
        description: "Primary key of the customer."
        tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: "Business identifier of the customer."

  # DIM_PRODUCTS
  - name: dim_products
    description: "Product dimension containing descriptive attributes of each product."

    columns:

      - name: product_id
        description: "Primary key of the product."
        tests:
          - unique
          - not_null

      - name: product_category_name
      - name: product_category_name_english
      - name: product_weight_g
      - name: product_length_cm
      - name: product_height_cm
      - name: product_width_cm

  # DIM_SELLER
  - name: dim_seller
    description: "Seller dimension containing location and identification data."

    columns:

      - name: seller_id
        description: "Primary key of the seller."
        tests:
          - unique
          - not_null

  # FCT_SALES
  - name: fct_sales
    description: "Fact table containing sales transactions at order item level."

    columns:

      - name: order_id
        description: "Order identifier."

      - name: order_item_id
        description: "Order item identifier (granularity of the fact)."

      - name: product_id
        description: "Foreign key to dim_products."
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id

      - name: seller_id
        description: "Foreign key to dim_seller."
        tests:
          - not_null
          - relationships:
              to: ref('dim_seller')
              field: seller_id

      - name: customer_id
        description: "Foreign key to dim_customers."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: date_key
        description: "Foreign key to dim_date."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: price
        description: "Price of the product."

      - name: freight_value
        description: "Shipping cost associated with the product."

      - name: total_item_amount
        description: "Total value of the order item (price + freight)."